<a class="skip" href="#main">{{ 'common.skip' | t }}</a>
@if (chrome()) {
  <app-header />
  @if (demo) { <p class="demo-banner container" role="note">{{ 'common.demo' | t }}</p> }
}
<main id="main" [class.container]="chrome()" tabindex="-1">
  <router-outlet />
</main>
@if (chrome()) {
  <app-footer />
  <app-bottom-nav />
  @if (saveState() === 'offline') { <p class="pill-status" role="status">{{ 'save.offline' | t }}</p> }
  @if (saveState() === 'error') { <p class="pill-status err" role="alert">{{ 'save.error' | t }}</p> }
}
<app-loader-overlay />
