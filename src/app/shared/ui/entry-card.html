<div class="ec-head">
  @if (selectable()) {
    <label class="ec-check">
      <input type="checkbox" [checked]="selected()" (change)="toggleSelect.emit()" [attr.aria-label]="'entry.select' | t: { title: entry().title }" />
    </label>
  }
  <span class="ec-type">{{ 'type.' + entry().type | t }}</span>
  <span class="ec-when">{{ when() }}</span>
  <app-star [on]="entry().featured" (toggle)="feature()" />
</div>
<div class="ec-title-row">
  <button type="button" class="ec-done" role="checkbox" [attr.aria-checked]="entry().done"
          [attr.aria-label]="(entry().done ? 'done.unmark' : 'done.mark') | t: { title: entry().title || ('entry.untitled' | t) }"
          [title]="(entry().done ? 'done.unmark' : 'done.mark') | t: { title: entry().title || ('entry.untitled' | t) }"
          (click)="toggleDone()">
    <span class="ec-done-ring"><app-icon name="check" [size]="14" stroke="3" /></span>
  </button>
  <h3 class="ec-title" [title]="entry().title || ('entry.untitled' | t)"><a [routerLink]="link()">{{ title().pre }}@if (title().hit) {<mark>{{ title().hit }}</mark>}{{ title().post }}</a></h3>
</div>
@if (entry().body && view() === 'cards') { <p class="ec-body">{{ entry().body }}</p> }
<div class="ec-foot">
  <div class="ec-tags">
    @if (where()) { <span class="chip">{{ where() }}</span> }
    @for (t of entry().tags; track t) { <span class="chip tag">{{ t }}</span> }
  </div>
  <span class="ec-tile ic" [class]="'ec-tile ic ' + tint()"><app-icon [name]="entry().type" [size]="view() === 'list' ? 22 : 26" color="#2A2A2E" /></span>
</div>
